name: Build iOS Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Theos Environment
      run: |
        bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
        echo "THEOS=/home/runner/theos" >> $GITHUB_ENV

    - name: Set up iOS SDK
      run: |
        curl -LO https://github.com/theos/sdks/raw/master/iPhoneOS14.5.sdk.tar.xz
        tar -xf iPhoneOS14.5.sdk.tar.xz
        mv iPhoneOS14.5.sdk /home/runner/theos/sdks/

    - name: Compile Mod Menu Binary
      run: |
        export THEOS=/home/runner/theos
        make package FINALPACKAGE=1

    - name: Save Compiled Dylib
      uses: actions/upload-artifact@v4
      with:
        name: SpongeModMenu-Dylib
        path: .theos/obj/debug/*.dylib
